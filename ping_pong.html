<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        #scoreboard {
            font-size: 36px;
            margin-bottom: 16px;
            letter-spacing: 8px;
        }
        canvas {
            border: 2px solid #e94560;
            border-radius: 4px;
            background: #16213e;
        }
        #controls {
            margin-top: 16px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scoreboard">
        <span id="score1">0</span> : <span id="score2">0</span>
    </div>
    <canvas id="game" width="800" height="500"></canvas>
    <div id="controls">
        Jugador 1: <b>Q</b> (subir) / <b>A</b> (bajar) &nbsp;&nbsp;&nbsp;
        Jugador 2: <b>P</b> (subir) / <b>L</b> (bajar) &nbsp;&nbsp;&nbsp;
        <b>Espacio</b>: iniciar/reiniciar
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const PADDLE_W = 12;
        const PADDLE_H = 90;
        const BALL_R = 8;
        const PADDLE_SPEED = 6;
        const BALL_SPEED_INIT = 5;
        const WIN_SCORE = 7;

        let paddle1 = { x: 20, y: H / 2 - PADDLE_H / 2, dy: 0 };
        let paddle2 = { x: W - 20 - PADDLE_W, y: H / 2 - PADDLE_H / 2, dy: 0 };
        let ball = { x: W / 2, y: H / 2, dx: 0, dy: 0 };
        let score1 = 0;
        let score2 = 0;
        let playing = false;
        let gameOver = false;

        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (!playing) startBall();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function startBall() {
            if (gameOver) {
                score1 = 0;
                score2 = 0;
                updateScoreboard();
                gameOver = false;
            }
            ball.x = W / 2;
            ball.y = H / 2;
            const angle = (Math.random() * Math.PI / 3) - Math.PI / 6;
            const dir = Math.random() < 0.5 ? 1 : -1;
            ball.dx = dir * BALL_SPEED_INIT * Math.cos(angle);
            ball.dy = BALL_SPEED_INIT * Math.sin(angle);
            playing = true;
        }

        function updateScoreboard() {
            document.getElementById('score1').textContent = score1;
            document.getElementById('score2').textContent = score2;
        }

        function update() {
            // Paddle movement
            paddle1.dy = 0;
            paddle2.dy = 0;
            if (keys['q']) paddle1.dy = -PADDLE_SPEED;
            if (keys['a']) paddle1.dy = PADDLE_SPEED;
            if (keys['p']) paddle2.dy = -PADDLE_SPEED;
            if (keys['l']) paddle2.dy = PADDLE_SPEED;

            paddle1.y = Math.max(0, Math.min(H - PADDLE_H, paddle1.y + paddle1.dy));
            paddle2.y = Math.max(0, Math.min(H - PADDLE_H, paddle2.y + paddle2.dy));

            if (!playing) return;

            // Ball movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Top/bottom bounce
            if (ball.y - BALL_R <= 0 || ball.y + BALL_R >= H) {
                ball.dy *= -1;
                ball.y = ball.y - BALL_R <= 0 ? BALL_R : H - BALL_R;
            }

            // Paddle 1 collision
            if (
                ball.dx < 0 &&
                ball.x - BALL_R <= paddle1.x + PADDLE_W &&
                ball.x - BALL_R >= paddle1.x &&
                ball.y >= paddle1.y &&
                ball.y <= paddle1.y + PADDLE_H
            ) {
                ball.dx = Math.abs(ball.dx) * 1.05;
                ball.dy += paddle1.dy * 0.3;
                ball.x = paddle1.x + PADDLE_W + BALL_R;
            }

            // Paddle 2 collision
            if (
                ball.dx > 0 &&
                ball.x + BALL_R >= paddle2.x &&
                ball.x + BALL_R <= paddle2.x + PADDLE_W &&
                ball.y >= paddle2.y &&
                ball.y <= paddle2.y + PADDLE_H
            ) {
                ball.dx = -Math.abs(ball.dx) * 1.05;
                ball.dy += paddle2.dy * 0.3;
                ball.x = paddle2.x - BALL_R;
            }

            // Scoring
            if (ball.x - BALL_R <= 0) {
                score2++;
                updateScoreboard();
                playing = false;
                if (score2 >= WIN_SCORE) gameOver = true;
            }
            if (ball.x + BALL_R >= W) {
                score1++;
                updateScoreboard();
                playing = false;
                if (score1 >= WIN_SCORE) gameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Center line
            ctx.setLineDash([8, 8]);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(W / 2, 0);
            ctx.lineTo(W / 2, H);
            ctx.stroke();
            ctx.setLineDash([]);

            // Paddles
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(paddle1.x, paddle1.y, PADDLE_W, PADDLE_H);
            ctx.fillStyle = '#e94560';
            ctx.fillRect(paddle2.x, paddle2.y, PADDLE_W, PADDLE_H);

            // Ball
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
            ctx.fill();

            // Messages
            if (!playing) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = '24px Courier New';
                ctx.textAlign = 'center';
                if (gameOver) {
                    const winner = score1 >= WIN_SCORE ? 'Jugador 1' : 'Jugador 2';
                    ctx.fillText(`${winner} gana!`, W / 2, H / 2 - 20);
                    ctx.font = '16px Courier New';
                    ctx.fillText('Presiona ESPACIO para jugar de nuevo', W / 2, H / 2 + 20);
                } else {
                    ctx.fillText('Presiona ESPACIO para comenzar', W / 2, H / 2);
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
